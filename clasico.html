<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Desk — Screener</title>
<style>
  :root{
    --bg:#0a0d13; --surface:#0f141d; --surface-2:#141b26; --line:#1e2733;
    --line-soft:#182029; --ink:#e8edf4; --ink-2:#9fb0c3; --ink-3:#5f7186;
    --acc:#16c784; --acc-ink:#03130c;
    --reacc:#0e8f63;
    --dist:#f6465d; --dist-ink:#1c0407;
    --redist:#a72a3a;
    --mixed:#f4c65a; --mixed-ink:#1c1503;
    --neu:#2a3444; --neu-ink:#9fb0c3;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 40px rgba(0,0,0,.45);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(22,199,132,.06), transparent 60%),
      radial-gradient(900px 500px at 10% 0%, rgba(59,130,246,.05), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; padding:28px 22px 60px;
  }
  .wrap{max-width:1240px;margin:0 auto}

  header{display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(140deg,#16c784,#0e8f63);
    box-shadow:0 8px 24px rgba(22,199,132,.35);
    display:grid;place-items:center;font-weight:800;color:#03130c;font-size:20px}
  h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:700}
  .sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
  .meta{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink-2);font-family:var(--mono)}
  .chip b{color:var(--ink);font-weight:600}
  .chip.demo{border-color:#7a5b12;color:#f4c65a;background:rgba(122,91,18,.15)}

  /* Tabs de vista */
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:5px;width:fit-content;margin-bottom:14px}
  .tab{padding:8px 18px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2);
    font-weight:600;user-select:none;transition:all .15s;border:1px solid transparent}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--surface-2);color:var(--ink);border-color:#2d4356}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
  .search{flex:1;min-width:180px}
  .search input{width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;
    font-family:var(--mono);outline:none;transition:border-color .15s}
  .search input:focus{border-color:#2d4356}
  .filters{display:flex;gap:7px;flex-wrap:wrap}
  .btn{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
    border-radius:999px;padding:8px 13px;font-size:12px;cursor:pointer;font-family:var(--mono);
    transition:all .15s;user-select:none}
  .btn:hover{border-color:#2d4356;color:var(--ink)}
  .btn.on{background:var(--surface-2);color:var(--ink);border-color:#2d4356}

  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
  th,td{padding:0;text-align:center}
  thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);
    color:var(--ink-2);font-size:11.5px;font-weight:600;letter-spacing:.6px;
    padding:13px 10px;border-bottom:1px solid var(--line);cursor:pointer;
    font-family:var(--mono);white-space:nowrap}
  thead th:hover{color:var(--ink)}
  thead th.pairhead{text-align:left;padding-left:20px;cursor:default;position:sticky;left:0;z-index:4}
  thead th .arrow{opacity:.35;font-size:9px;margin-left:4px}
  thead th.sorted .arrow{opacity:1;color:var(--acc)}

  tbody td{border-bottom:1px solid var(--line-soft);padding:9px 8px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.015)}
  .pair{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;
    padding-left:20px;font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.3px}
  tbody tr:hover .pair{background:#111825}

  .pill{display:inline-flex;align-items:center;gap:6px;min-width:88px;justify-content:center;
    padding:7px 11px;border-radius:var(--radius-sm);font-size:11.5px;font-weight:700;
    font-family:var(--mono);letter-spacing:.4px;border:1px solid transparent;position:relative;transition:transform .1s}
  .pill:hover{transform:translateY(-1px)}
  .pill .g{font-size:10px;opacity:.9}
  .pill.acc{background:var(--acc);color:var(--acc-ink)}
  .pill.reacc{background:transparent;color:var(--acc);border-color:var(--reacc);box-shadow:0 0 0 1px rgba(22,199,132,.15) inset}
  .pill.dist{background:var(--dist);color:var(--dist-ink)}
  .pill.redist{background:transparent;color:var(--dist);border-color:var(--redist);box-shadow:0 0 0 1px rgba(246,70,93,.15) inset}
  .pill.mixed{background:var(--mixed);color:var(--mixed-ink)}
  .pill.neu{background:var(--neu);color:var(--neu-ink)}
  .pill[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);
    left:50%;transform:translateX(-50%);background:#05080d;border:1px solid var(--line);color:var(--ink-2);
    padding:8px 11px;border-radius:8px;font-size:11px;white-space:nowrap;font-family:var(--mono);z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}

  /* Barra de porcentaje (sentiment) */
  .barcell{display:flex;align-items:center;gap:10px;min-width:150px;padding:0 6px}
  .bar{flex:1;height:10px;border-radius:6px;background:var(--dist);overflow:hidden;position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .bar > i{display:block;height:100%;background:var(--acc);border-radius:6px 0 0 6px}
  .barnum{font-family:var(--mono);font-size:12px;font-weight:700;width:40px;text-align:right}
  .barnum.bull{color:var(--acc)} .barnum.bear{color:var(--dist)} .barnum.mid{color:var(--mixed)}
  .comp{font-family:var(--mono);font-size:12px;font-weight:700}
  .comp.bull{color:var(--acc)} .comp.bear{color:var(--dist)} .comp.mid{color:var(--ink-3)} .comp.vol{color:var(--ink-2)}
  .na{color:var(--ink-3);font-family:var(--mono);font-size:12px}
  .conf{display:inline-block;margin-left:8px;font-size:9.5px;font-family:var(--mono);font-weight:700;
    color:#0a0d13;background:var(--acc);border-radius:5px;padding:2px 6px;letter-spacing:.5px;vertical-align:middle}
  .conf.bear{background:var(--dist)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:16px 2px 0;color:var(--ink-3);font-size:11.5px;font-family:var(--mono)}
  .legend .item{display:flex;align-items:center;gap:7px}
  .swatch{width:22px;height:14px;border-radius:5px;border:1px solid transparent}
  .swatch.acc{background:var(--acc)} .swatch.reacc{background:transparent;border-color:var(--reacc)}
  .swatch.dist{background:var(--dist)} .swatch.redist{background:transparent;border-color:var(--redist)}
  .swatch.mixed{background:var(--mixed)} .swatch.neu{background:var(--neu)}
  .foot{color:var(--ink-3);font-size:11px;margin-top:22px;text-align:center;font-family:var(--mono);line-height:1.7}
  .empty{padding:40px;text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">TD</div>
      <div><h1>Trading Desk — Screener</h1><div class="sub" id="sub"></div></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tabs" id="tabs">
    <span class="tab on" data-view="models">Modelos</span>
    <span class="tab" data-view="sentiment">Sentiment</span>
    <span class="tab" data-view="combined">Combinado</span>
  </div>

  <div class="toolbar">
    <div class="search"><input id="q" placeholder="filtrar par… (ej. JPY, EUR)"></div>
    <div class="filters" id="biasFilters">
      <span class="btn on" data-bias="all">Todos</span>
      <span class="btn" data-bias="bull">▲ Bull</span>
      <span class="btn" data-bias="bear">▼ Bear</span>
      <span class="btn" data-bias="flat">◆ Mixto</span>
    </div>
  </div>

  <div class="card"><div class="scroll"><table id="grid">
    <thead id="thead"></thead><tbody id="tbody"></tbody>
  </table></div></div>

  <div class="legend" id="legend"></div>
  <div class="foot" id="foot"></div>
</div>

  return `<span class="pill ${cls}"${t}><span class="g">${glyph}</span>${text}</span>`;
}
function verdictPill(v, tip){ const x = VM[v]||VM.Neutral; return pill(x.cls, x.glyph, v.toUpperCase(), tip); }
function biasOfVerdict(v){ return (VM[v]||VM.Neutral).bias; }
function pct(n){ return n==null ? '<span class="na">s/d</span>' : n.toFixed(0)+'%'; }
function barCell(p, tip){
  if(p==null) return `<div class="barcell"><span class="na">sin datos</span></div>`;
  const cls = p>55?'bull':(p<45?'bear':'mid');
  const t = tip ? ` title="${(tip+'').replace(/"/g,'&quot;')}"` : '';
  return `<div class="barcell"${t}><div class="bar"><i style="width:${p}%"></i></div>`+
         `<span class="barnum ${cls}">${p.toFixed(0)}%</span></div>`;
}
function compCell(v){
  if(v==null) return `<span class="na">–</span>`;
  const cls = v>0.05?'bull':(v<-0.05?'bear':'mid');
  return `<span class="comp ${cls}">${v>0?'+':''}${v.toFixed(2)}</span>`;
}
function volCell(v){ return v==null?'<span class="na">–</span>':`<span class="comp vol">×${v.toFixed(2)}</span>`; }
function compTip(h){ return h?`stage ${h.stage}  trend ${h.trend}  mom ${h.momentum}  vol ×${h.volume}  → ${h.normalized}%`:''; }

// ---- columnas por vista ----
function headFor(v){
  if(v==="models"){
    let h = `<th class="pairhead">PAR</th>`;
    for(const tf of TFS){ const s=(sortKey===tf)?'sorted':''; const a=(sortKey===tf)?(sortDir>0?'▼':'▲'):'↕';
      h+=`<th class="${s}" data-sort="${tf}">${tfLabel(tf)}<span class="arrow">${a}</span></th>`; }
    return h;
  }
  if(v==="sentiment"){
    const cols=[["stage","STAGE"],["trend","TREND"],["mom","MOM"],["vol","VOL"],
                ["intraday","INTRADÍA"],["higher","INSTIT."],["overall","GENERAL"],["sv","VEREDICTO"]];
    let h=`<th class="pairhead">PAR</th>`;
    for(const [k,lbl] of cols){ const s=(sortKey===k)?'sorted':''; const a=(sortKey===k)?(sortDir>0?'▼':'▲'):'↕';
      h+=`<th class="${s}" data-sort="${k}">${lbl}<span class="arrow">${a}</span></th>`; }
    return h;
  }
  // combined
  const cols=[["model","MODELO"],["sent","SENTIMENT"],["combined","COMBINADO"]];
  let h=`<th class="pairhead">PAR</th>`;
  for(const [k,lbl] of cols){ const s=(sortKey===k)?'sorted':''; const a=(sortKey===k)?(sortDir>0?'▼':'▲'):'↕';
    h+=`<th class="${s}" data-sort="${k}">${lbl}<span class="arrow">${a}</span></th>`; }
  return h;
}

function rowFor(v, r){
  if(v==="models"){
    let tds=`<td class="pair">${r.pair}</td>`;
    for(const tf of TFS){ const c=r.cells[tf];
      if(!c){ tds+=`<td>${pill('neu','■','—')}</td>`; continue; }
      const x=SM[c.tag]||SM.Neutral; tds+=`<td>${pill(x.cls,x.glyph,x.abbr,c.debug)}</td>`; }
    return tds;
  }
  if(v==="sentiment"){
    const s=r.sentiment||{}, c=s.components||{};
    return `<td class="pair">${r.pair}</td>`+
      `<td>${compCell(c.stage)}</td>`+
      `<td>${compCell(c.trend)}</td>`+
      `<td>${compCell(c.momentum)}</td>`+
      `<td>${volCell(c.volume)}</td>`+
      `<td>${barCell(s.intraday_pct, compTip(s.intraday))}</td>`+
      `<td>${barCell(s.higher_pct, compTip(s.higher))}</td>`+
      `<td>${barCell(s.overall_pct)}</td>`+
      `<td>${verdictPill(s.verdict||'Neutral')}</td>`;
  }
  // combined
  const mb=r.model_bias||{}, s=r.sentiment||{}, cb=r.combined||{};
  const conf = cb.confluence ? `<span class="conf ${biasOfVerdict(cb.verdict)==='bear'?'bear':''}">CONFLUENCIA</span>` : '';
  return `<td class="pair">${r.pair}</td>`+
    `<td>${verdictPill(mb.verdict||'Neutral', 'modelo '+(mb.pct==null?'s/d':mb.pct+'% alcista'))}</td>`+
    `<td>${verdictPill(s.verdict||'Neutral', 'sentiment '+(s.overall_pct==null?'s/d':s.overall_pct+'% alcista'))}</td>`+
    `<td>${verdictPill(cb.verdict||'Neutral')}${conf}</td>`;
}

// valor para ordenar/filtrar
function sortVal(v, r, key){
  if(v==="models"){ const c=r.cells[key]; return c?({bull:2,flat:1,bear:0})[(SM[c.tag]||{}).bias]:-1; }
  if(v==="sentiment"){ const s=r.sentiment||{}, c=s.components||{};
    if(key==="sv") return ({bull:2,flat:1,bear:0})[biasOfVerdict(s.verdict||'Neutral')];
    if(key==="stage") return c.stage==null?-9:c.stage;
    if(key==="trend") return c.trend==null?-9:c.trend;
    if(key==="mom") return c.momentum==null?-9:c.momentum;
    if(key==="vol") return c.volume==null?-9:c.volume;
    return s[key+"_pct"]==null?-1:s[key+"_pct"]; }
  const mb=r.model_bias||{}, s=r.sentiment||{}, cb=r.combined||{};
  if(key==="model") return mb.score==null?0:mb.score;
  if(key==="sent")  return s.score==null?0:s.score;
  return cb.score==null?0:cb.score;
}
function rowBias(v, r){
  if(v==="models"){ return TFS.map(tf=>r.cells[tf]&&(SM[r.cells[tf].tag]||{}).bias); }
  if(v==="sentiment"){ return [biasOfVerdict((r.sentiment||{}).verdict||'Neutral')]; }
  return [biasOfVerdict((r.combined||{}).verdict||'Neutral')];
}

function render(){
  document.getElementById('thead').innerHTML = `<tr>${headFor(view)}</tr>`;
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.sort;
      if(sortKey===k){sortDir=-sortDir;} else {sortKey=k;sortDir=1;} render(); };
  });

  let rows = DATA.results.filter(r=>{
    if(query && !r.pair.toUpperCase().includes(query)) return false;
    if(biasFilter!=="all"){ if(!rowBias(view,r).some(b=>b===biasFilter)) return false; }
    return true;
  });
  if(sortKey){ rows = rows.slice().sort((a,b)=> sortDir*(sortVal(view,b,sortKey)-sortVal(view,a,sortKey))); }

  const tb=document.getElementById('tbody');
  const ncol = view==="models"?TFS.length+1:(view==="sentiment"?9:4);
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="${ncol}" class="empty">Sin resultados</td></tr>`; return; }
  tb.innerHTML = rows.map(r=>`<tr>${rowFor(view,r)}</tr>`).join('');
  renderLegend();
}

function renderLegend(){
  const el=document.getElementById('legend');
  if(view==="models"){
    el.innerHTML = Object.entries(SM).map(([tag,x])=>
      `<span class="item"><span class="swatch ${x.cls}"></span>${x.glyph} ${tag}</span>`).join('');
  } else {
    el.innerHTML = [['acc','▲ Bullish'],['dist','▼ Bearish'],['mixed','◆ Mixed'],['neu','■ Neutral']]
      .map(([c,l])=>`<span class="item"><span class="swatch ${c}"></span>${l}</span>`).join('')
      + (view==="sentiment"
          ? `<span class="item">barra: verde = % alcista</span>`
          : `<span class="item"><span class="conf">CONFLUENCIA</span> modelo y sentiment coinciden</span>`);
  }
}

// eventos
document.getElementById('q').addEventListener('input', e=>{ query=e.target.value.toUpperCase(); render(); });
document.querySelectorAll('#biasFilters .btn').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('#biasFilters .btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); biasFilter=b.dataset.bias; render(); };
});
document.querySelectorAll('#tabs .tab').forEach(t=>{
  t.onclick=()=>{ document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); view=t.dataset.view; sortKey=null; render(); };
});

const FOOTS = {
  models: 'Vista Modelos · estados MB por timeframe · hover para ver dom/cnt/cur/prev/gate',
  sentiment: 'Vista Sentiment v1.0 · compuesto = stage (tu modelo MB) + trend (EMAs) + momentum + volumen · fórmula de Ziks (30/40/27×vol) · hover en las barras para el desglose por horizonte',
  combined: 'Vista Combinado · modelo + sentiment · CONFLUENCIA = ambos coinciden en dirección'
};
const _origRender = render;
render = function(){ _origRender(); document.getElementById('foot').textContent = FOOTS[view]; };

render();
</script>
</body>
</html>
