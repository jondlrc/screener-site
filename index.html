<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Desk — Screener</title>
<style>
:root{
 --bg:#0a0d13;--surface:#0f141d;--surface2:#141b26;--surface3:#182130;--line:#1e2733;
 --line-soft:#161d27;--ink:#e8edf4;--ink2:#9fb0c3;--ink3:#5f7186;
 --bull:#16c784;--bear:#f6465d;--warn:#f4c65a;--contra:#a78bfa;--info:#38bdf8;--stale:#e0a23c;
 --radius:14px;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
 --font:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
 /* sistema de movimiento (minimalista, un poco más presente) */
 --t-fast:150ms;--t:240ms;--t-slow:480ms;
 --ease:cubic-bezier(.22,1,.36,1);}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:
 radial-gradient(1100px 560px at 90% -10%,rgba(22,199,132,.05),transparent 60%),
 radial-gradient(760px 420px at 5% 0%,rgba(59,130,246,.045),transparent 55%),var(--bg);
 color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;
 display:flex;flex-direction:column;height:100vh;overflow:hidden}
.demo{background:rgba(244,198,90,.1);border-bottom:1px solid #7a5b12;color:var(--warn);
 font-family:var(--mono);font-size:11px;text-align:center;padding:5px}
.top{display:flex;align-items:center;gap:16px;padding:15px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#16c784,#0e8f63);
 display:grid;place-items:center;font-weight:800;color:#03130c;font-size:15px}
.brand b{font-size:15px}.brand .s{color:var(--ink3);font-size:11px;font-family:var(--mono)}
.spacer{flex:1}
.toggle{display:flex;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.toggle .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface3);
 border-radius:999px;transition:transform var(--t) var(--ease);z-index:0}
.toggle.swing .ind{transform:translateX(100%)}
.toggle button{flex:1;position:relative;z-index:1;background:none;border:0;color:var(--ink2);font-family:var(--font);
 font-weight:600;font-size:12.5px;padding:7px 16px;border-radius:999px;cursor:pointer;transition:color var(--t) var(--ease)}
.toggle button.on{color:var(--ink)}
.toggle button:active{transform:scale(.97)}
.updated{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.filters{display:flex;gap:8px;align-items:center;padding:11px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;
 padding:7px 13px;font-size:12px;font-family:var(--mono);cursor:pointer;user-select:none;
 transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.chip:hover{border-color:#2d4356}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--surface3);color:var(--ink);border-color:#2d4356}
.filters .search{margin-left:auto}
.filters input{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;
 padding:8px 12px;font-family:var(--mono);font-size:12px;outline:none;width:180px}
/* navegación tipo página: lista <-> detalle */
.stage{position:relative;flex:1;overflow:hidden}
.pane{position:absolute;inset:0;overflow-y:auto;transition:transform var(--t-slow) var(--ease)}
.pane-inner{max-width:1120px;margin:0 auto;width:100%}
.pane-list{transform:translateX(0)}
.pane-detail{transform:translateX(100%);background:var(--bg);pointer-events:none}
body.detail-open .pane-list{transform:translateX(-100%);pointer-events:none}
body.detail-open .pane-detail{transform:translateX(0);pointer-events:auto}
.detailbar{position:sticky;top:0;z-index:6;background:rgba(10,13,19,.86);backdrop-filter:blur(8px);
 display:flex;align-items:center;gap:10px;padding:11px 22px;border-bottom:1px solid var(--line)}
.backbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-family:var(--font);
 font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
 transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.backbtn:hover{color:var(--ink);border-color:#2d4356}
.backbtn:active{transform:scale(.97)}
.backbtn .xt{font-size:14px;line-height:1}
.cockpit{padding:20px 24px 40px}
@media(max-width:640px){.hz .hzc:not(.act){display:none}
 .rhead,.row{grid-template-columns:64px 1fr 78px 100px;gap:8px;padding:11px 14px}
 .rhead .fresh,.row .fresh{display:none}}
.rhead,.row{display:grid;grid-template-columns:76px 1fr 104px 122px 22px;align-items:center;gap:12px;padding:12px 18px}
.rhead{position:sticky;top:0;background:var(--surface2);border-bottom:1px solid var(--line);z-index:2;
 font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--ink3)}
.row{border-bottom:1px solid var(--line-soft);cursor:pointer;
 transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.row:hover{background:rgba(255,255,255,.03);transform:translateX(2px)}
.row:active{background:rgba(255,255,255,.05);transform:translateX(1px)}
.row.sel{background:rgba(56,189,248,.06);box-shadow:inset 3px 0 0 var(--info)}
.pair{font-family:var(--mono);font-weight:700;font-size:13.5px}
.meter{display:flex;align-items:center;gap:9px}
.track{position:relative;flex:1;height:8px;background:var(--surface3);border-radius:5px;overflow:hidden}
.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0;border-radius:5px}
.fill.bull{left:50%;background:var(--bull)}.fill.bear{right:50%;background:var(--bear)}
.mval{font-family:var(--mono);font-weight:700;font-size:12.5px;width:46px;text-align:right}
.mval.bull{color:var(--bull)}.mval.bear{color:var(--bear)}.mval.neu{color:var(--warn)}
.dir{font-size:10px}
.conv{display:flex;align-items:center;gap:7px}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:1px solid var(--line)}
.dot.on{background:var(--ink);border-color:var(--ink)}
.conv .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.conv.hi .lbl{color:var(--ink)}
.rt{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:6px;text-align:center}
.rt.ok{background:rgba(167,139,250,.15);color:var(--contra)}
.rt.warn{background:rgba(244,198,90,.15);color:var(--warn)}
.rt.na{background:var(--surface3);color:var(--ink3)}
.rt.neu{background:var(--surface3);color:var(--ink2)}
.fresh{width:8px;height:8px;border-radius:50%;justify-self:center}
.fresh.ok{background:var(--bull)}.fresh.stale{background:var(--stale)}
.empty{padding:40px;text-align:center;color:var(--ink3);font-family:var(--mono);font-size:13px}
/* cockpit */
.ckhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ckhead h2{margin:0;font-size:20px;font-family:var(--mono)}
.readbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
 padding:15px 17px;margin:12px 0 18px;font-size:14px;line-height:1.6}
.axes{display:flex;flex-direction:column;gap:9px;margin:14px 0 20px}
.axis{display:flex;align-items:center;gap:11px;font-size:13px}
.ax-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.ax-ic.yes{background:rgba(22,199,132,.16);color:var(--bull)}
.ax-ic.no{background:rgba(244,198,90,.16);color:var(--warn)}
.ax-ic.na{background:var(--surface3);color:var(--ink3)}
.axis .sub{color:var(--ink3);font-size:11.5px;font-family:var(--mono)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
.block>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.block>summary::-webkit-details-marker{display:none}
.block>summary .c{margin-left:auto;color:var(--ink3);font-size:11px;font-family:var(--mono)}
.block .body{padding:4px 16px 16px}
.tfgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tf{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center}
.tf .t{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.tf .g{font-size:11px;font-weight:800;margin-top:3px;font-family:var(--mono)}
.tf.bull .g{color:var(--bull)}.tf.bear .g{color:var(--bear)}.tf.neu .g{color:var(--warn)}
.tf{transition:box-shadow var(--t) var(--ease),background var(--t) var(--ease)}
.tf.hl{box-shadow:0 0 0 1.5px var(--info) inset,0 0 12px rgba(56,189,248,.12);background:rgba(56,189,248,.05)}
.tfnote{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin:10px 0 0}
.tfnote b{color:var(--info)}
.levels{display:flex;gap:18px;margin-top:12px;font-family:var(--mono);font-size:12px}
.levels b{color:var(--ink2)}
.hz{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hzc{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px}
.hzc.act{border-color:#2d4356;box-shadow:0 0 0 1px rgba(56,189,248,.2) inset}
.hzc h4{margin:0 0 10px;font-size:12px;font-family:var(--mono);color:var(--ink2);letter-spacing:.5px}
.comp{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:4px 0}
.comp .v{font-weight:700}.comp .v.p{color:var(--bull)}.comp .v.n{color:var(--bear)}.comp .v.z{color:var(--ink3)}
.hznorm{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.hznorm .big{font-family:var(--mono);font-weight:800;font-size:18px}
.retailbox{display:flex;gap:16px;align-items:center}
.rbars{flex:1}
.rrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-family:var(--mono);font-size:12px}
.rrow .bar{flex:1;height:9px;border-radius:5px;background:var(--surface3);overflow:hidden}
.rrow .bar i{display:block;height:100%}
.rrow.long .bar i{background:var(--bull)}.rrow.short .bar i{background:var(--bear)}
.interp{background:rgba(167,139,250,.09);border:1px solid #3a3357;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.interp b{color:var(--contra)}
.na-state{color:var(--ink3);font-family:var(--mono);font-size:12.5px;padding:8px 0}
.legend{padding:12px 22px;color:var(--ink3);font-family:var(--mono);font-size:10.5px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.legend b{color:var(--ink2)}
/* estado en cabecera */
.hstatus{display:flex;align-items:center;gap:9px}
.warnchip{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:6px;
 background:rgba(224,162,60,.14);color:var(--stale)}
body.is-stale .fresh{background:var(--stale)!important}
/* accesibilidad: foco visible */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible,.row:focus-visible,.chip:focus-visible{
 outline:2px solid var(--info);outline-offset:2px;border-radius:8px}
.row:focus{outline:none}.row:focus-visible{box-shadow:inset 3px 0 0 var(--info),0 0 0 2px var(--info)}
/* skeleton (carga) */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,var(--surface2) 25%,#1b2432 37%,var(--surface2) 63%);
 background-size:800px 100%;animation:shimmer 1.4s infinite;border-radius:6px;height:12px}
/* ---- movimiento (minimalista): entradas + datos que se llenan ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fillW{from{width:0}}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ckIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* radar: filas entran escalonadas SOLO cuando se pide (clase .anim) */
#rows.anim .row{animation:fadeUp var(--t) var(--ease) both;animation-delay:calc(var(--i,0)*26ms)}
/* medidores: se llenan desde 0 */
.track .fill{animation:fillW var(--t-slow) var(--ease)}
/* cockpit: entra suave y en secuencia al cambiar de par/horizonte */
.cockpit.ckin>*{animation:ckIn var(--t) var(--ease) both}
.cockpit.ckin .readbox{animation-delay:30ms}
.cockpit.ckin .axes{animation-delay:70ms}
.cockpit.ckin .block:nth-of-type(1){animation-delay:110ms}
.cockpit.ckin .block:nth-of-type(2){animation-delay:150ms}
.cockpit.ckin .block:nth-of-type(3){animation-delay:190ms}
/* ejes de convicción entran escalonados */
.cockpit.ckin .axis{animation:fadeUp var(--t) var(--ease) both}
.cockpit.ckin .axis:nth-child(2){animation-delay:60ms}
.cockpit.ckin .axis:nth-child(3){animation-delay:120ms}
/* chips de TF del modelo: pop escalonado */
.cockpit.ckin .tf{animation:popIn var(--t) var(--ease) both;animation-delay:calc(var(--j,0)*24ms + 120ms)}
/* puntos de convicción: pop escalonado */
.dot.on{animation:popIn var(--t) var(--ease) both}
.dots .dot:nth-child(2).on{animation-delay:60ms}
.dots .dot:nth-child(3).on{animation-delay:120ms}
/* barras de retail: crecen */
.rrow .bar i{animation:fillW var(--t-slow) var(--ease)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="demobar" class="demo" style="display:none">◆ DATA DEMO (sintética) — conecta OANDA para datos reales</div>
<div class="top">
 <div class="brand"><div class="logo">TD</div><div><b>Trading Desk — Screener</b><div class="s" id="sub"></div></div></div>
 <div class="spacer"></div>
 <div class="toggle" id="hz" role="tablist" aria-label="Horizonte"><span class="ind" aria-hidden="true"></span><button data-hz="intr" class="on" role="tab" aria-selected="true">Intradía</button><button data-hz="inst" role="tab" aria-selected="false">Swing</button></div>
 <div class="hstatus"><span id="retailwarn"></span><span class="fresh ok" id="freshdot" aria-hidden="true"></span><span class="updated" id="updated"></span></div>
</div>
<div class="stage" id="stage">
 <section class="pane pane-list" id="paneList">
  <div class="pane-inner">
   <div class="filters">
    <span class="chip on" data-f="all">Todos</span><span class="chip" data-f="bull">▲ Bull</span>
    <span class="chip" data-f="bear">▼ Bear</span><span class="chip" data-f="hi">◆ Alta convicción</span>
    <span class="chip" data-f="contra">⚡ Contrarian</span>
    <span class="search"><input id="q" placeholder="filtrar par…"></span>
   </div>
   <div class="rhead"><div>PAR</div><div>MI SEÑAL</div><div>CONVICCIÓN</div><div>RETAIL</div><div></div></div>
   <div id="rows"></div>
  </div>
 </section>
 <section class="pane pane-detail" id="paneDetail" aria-hidden="true" role="dialog" aria-label="Detalle del par">
  <div class="detailbar"><button class="backbtn" id="backbtn" aria-label="Volver a la lista de pares"><span class="xt">✕</span> Volver a pares</button></div>
  <div class="pane-inner"><div class="cockpit" id="cockpit"></div></div>
 </section>
</div>
<div class="legend">
 <span><b>verde/rojo</b> = dirección</span><span><b>puntos ●</b> = convicción</span>
 <span><b>violeta</b> = contra el retail</span><span><b>ámbar</b> = divergencia / retail alineado</span>
 <span><b>gris</b> = n/d</span>
</div>
